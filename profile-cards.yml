name: profile-cards

on:
  schedule:
    - cron: "17 3 * * *"        # daily
  workflow_dispatch:
  push:
    paths: ["scripts/**", "theme.json", "assets/**"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools pillow

      # If you already have a step that refreshes data/contributions.json,
      # keep yours and delete this one.
      - name: Refresh contribution data
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
        run: python scripts/fetch_contributions.py

      - name: Render cards
        run: python scripts/render_cards.py

      - name: Commit cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards
          git diff --cached --quiet || (git commit -m "chore: refresh profile cards" && git push)
